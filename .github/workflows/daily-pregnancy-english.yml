name: Daily B2 pregnancy English

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview the latest saved lesson without sending Telegram"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - "data/pregnancy_english_lessons/*.json"

concurrency:
  group: daily-b2-pregnancy-english
  cancel-in-progress: false

jobs:
  send-english-lesson:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Find latest saved lesson
        id: lesson
        run: |
          lesson=$(find data/pregnancy_english_lessons -maxdepth 1 -name '*.json' -type f | sort | tail -n 1)
          if [ -z "$lesson" ]; then
            echo "No saved English lesson found."
            exit 1
          fi
          echo "path=$lesson" >> "$GITHUB_OUTPUT"

      - name: Send saved lesson to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          LESSON_JSON: ${{ steps.lesson.outputs.path }}
        run: python3 tools/daily_pregnancy_english.py
