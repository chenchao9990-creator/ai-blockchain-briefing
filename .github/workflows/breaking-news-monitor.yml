name: Breaking news monitor

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview candidate alerts without sending Telegram"
        required: false
        default: true
        type: boolean
      manual_headline:
        description: "Optional verified breaking-news headline"
        required: false
        type: string
      manual_story:
        description: "Optional factual story summary"
        required: false
        type: string
      manual_keywords:
        description: "Optional keywords separated by vertical bars"
        required: false
        type: string
      manual_source:
        description: "Optional source publication"
        required: false
        type: string
      manual_url:
        description: "Optional source URL"
        required: false
        type: string
  schedule:
    - cron: "*/30 * * * *"

jobs:
  monitor-breaking-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check and send breaking alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          BREAKING_HEADLINE: ${{ github.event_name == 'workflow_dispatch' && inputs.manual_headline || '' }}
          BREAKING_STORY: ${{ github.event_name == 'workflow_dispatch' && inputs.manual_story || '' }}
          BREAKING_KEYWORDS: ${{ github.event_name == 'workflow_dispatch' && inputs.manual_keywords || '' }}
          BREAKING_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.manual_source || '' }}
          BREAKING_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.manual_url || '' }}
        run: python3 tools/breaking_rss_monitor.py

      - name: Commit breaking alert state
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f data/breaking_sent.json ]; then
            git add data/breaking_sent.json breaking-news.html
          else
            echo "No breaking alert state file."
          fi
          if git diff --cached --quiet; then
            echo "No breaking alert state changes."
          else
            git commit -m "Update breaking news alert state"
            git push
          fi
